# Optional systemd >=254 standalone delegation. Use with config "cgroup": {}.
# For a custom slice/unit, adjust the exact writable service hierarchy.
[Service]
Delegate=cpu memory pids io
DelegateSubgroup=controller
OOMPolicy=continue
ProtectControlGroups=no
ReadOnlyPaths=/sys/fs/cgroup
ReadWritePaths=/sys/fs/cgroup/system.slice/chickadee.service
