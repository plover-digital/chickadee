# Optional systemd >=254 delegation. Install as
# /etc/systemd/system/chickadee-worker.service.d/cgroup.conf only after reviewing
# the parent MemoryMax against guest budget + VM overhead + controller headroom.
[Service]
Delegate=cpu memory pids io
DelegateSubgroup=controller
OOMPolicy=continue
ProtectControlGroups=no
ReadOnlyPaths=/sys/fs/cgroup
ReadWritePaths=/sys/fs/cgroup/system.slice/chickadee-worker.service
