# Copy to .github/workflows/chickadee-ci.yml AFTER installing the host controller.
# Keep this workflow limited to trusted commits. Public fork PRs use hosted CI.
name: plover-digital main-branch build and test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: chickadee
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.3'
          cache: false
      - run: make build test
