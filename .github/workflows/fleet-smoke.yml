name: Fleet worker smoke
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Operator test queue
        required: true
        default: chickadee-fleet-smoke
        type: choice
        options:
          - chickadee-fleet-smoke
          - chickadee
          - chickadee-small-ubuntu-2604
          - chickadee-medium-ubuntu-2604
      hold_seconds:
        description: Hold the guest for broker restart acceptance
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '90'
          - '300'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify guest tools and public egress
        run: |
          set -euo pipefail
          test -d /home/runner/work
          git --version
          curl --fail --silent --show-error https://api.github.com/zen
          docker version
          docker run --rm hello-world
      - name: Collect bounded guest isolation evidence
        run: python3 scripts/isolation-probe.py
        # Guest-only observations do not prove firewall acceptance.
        # Controlled listener/counter checks: docs/network-acceptance.md.
      - name: Verify guest disk reclamation
        run: |
          set -euo pipefail
          printf 'tmp_fstype=%s\n' "$(findmnt -n -o FSTYPE --target /tmp)"
          printf 'runner_temp_fstype=%s\n' "$(findmnt -n -o FSTYPE --target "$RUNNER_TEMP")"
          python3 -c 'import os; assert os.stat(os.environ["RUNNER_TEMP"]).st_dev == os.stat("/").st_dev, "disk probe must use root filesystem"'
          test "$(findmnt -n -o FSTYPE --target "$RUNNER_TEMP")" != tmpfs
          test "$(findmnt -n -o FSTYPE --target "$RUNNER_TEMP")" != ramfs
          dd if=/dev/urandom of="$RUNNER_TEMP/chickadee-trim-probe" bs=1M count=64 status=none
          sync
          rm "$RUNNER_TEMP/chickadee-trim-probe"
          sudo fstrim --verbose /
      - name: Short build
        run: |
          printf 'int main(void) { return 0; }\n' > /tmp/chickadee-smoke.c
          cc -Wall -Werror /tmp/chickadee-smoke.c -o /tmp/chickadee-smoke
          /tmp/chickadee-smoke
      - name: Hold guest for broker restart acceptance
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          case "$HOLD_SECONDS" in 0|90|300) sleep "$HOLD_SECONDS" ;; *) exit 1 ;; esac
