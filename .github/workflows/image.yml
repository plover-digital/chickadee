name: Build runner image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install Ubuntu image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libguestfs-tools \
            python3 curl gpgv ubuntu-keyring xz-utils build-essential
      - name: Build credential-free runner image
        run: make image
      - name: Archive versioned image artifacts
        run: tar -czf build/chickadee-image.tar.gz -C images .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chickadee-image
          path: build/chickadee-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
