name: Bun cache compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    if: github.repository == 'plover-digital/chickadee' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun --version
  restore:
    needs: hosted
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [chickadee-medium-ubuntu-2404, chickadee]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Verify minimal guest cache dependencies
        run: |
          set -eu
          printf 'HOME=%s uid=%s\n' "$HOME" "$(id -u)"
          for tool in tar unzip zstd; do command -v "$tool"; done
          test ! -e "$HOME/.bun/bin/bun"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Verify restored executable
        run: |
          set -eu
          ls -l "$HOME/.bun/bin/bun"
          bun --version
          bun -e 'if (1 + 1 !== 2) process.exit(1)'
      - name: Remove restored Bun before testing a fresh download
        run: rm "$HOME/.bun/bin/bun"
      - name: Install Bun without a cache
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          no-cache: true
      - name: Verify freshly downloaded executable
        run: bun -e 'if (1 + 1 !== 2) process.exit(1)'
      - name: Inspect cache result on failure
        if: failure()
        run: |
          ls -ld "$HOME" "$HOME/.bun" "$HOME/.bun/bin" || true
          ls -l "$HOME/.bun/bin/bun" || true
          readlink "$HOME/.bun/bin/bun" || true
          # Old workdir layouts restored HOME caches to this wrong location.
          ls -l /opt/actions-runner/.bun/bin/bun || true
      - name: Verify uncached installation on failure
        if: failure()
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          no-cache: true
