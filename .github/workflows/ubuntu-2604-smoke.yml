name: Ubuntu 26.04 runner validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    if: github.repository == 'plover-digital/chickadee' && github.ref == 'refs/heads/main'
    runs-on: chickadee-medium-ubuntu-2604
    timeout-minutes: 20
    steps:
      - name: Verify distro, profile, native tools and defaults
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:26.04
          test "$(id -u)" = 1000
          test "$(nproc)" = 4
          test "$RUNNER_TOOL_CACHE" = /opt/hostedtoolcache
          for tool in unzip tar zstd jq sudo node npm go python3 pip3 gcc g++ clang-20 clang-21 clang-22 java mvn ruby php composer docker cargo rustc rustup dotnet firefox google-chrome geckodriver; do command -v "$tool"; done
          node --version | grep -Fx v24.21.0
          go version | grep 'go1.26.8'
          test "$JAVA_HOME" = /usr/lib/jvm/java-17-openjdk-amd64
          "$JAVA_HOME/bin/java" -version
          sudo -n true
          for version in 3.10.21 3.11.16 3.12.14 3.13.15 3.14.7; do
            "$RUNNER_TOOL_CACHE/Python/$version/x64/bin/python3" -c 'import ssl,sqlite3,ctypes,zlib,pip'
          done
          docker version
          docker compose version
          docker buildx version
          docker run --rm hello-world
          dotnet --list-sdks
          rustup show active-toolchain
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Exercise installed runtimes
        run: |
          set -eu
          python -c 'import ssl,sqlite3,ctypes,zlib; print("Ubuntu26 Python works")'
          node -e 'console.log(process.version)'
          bun -e 'if (1 + 1 !== 2) process.exit(1)'
          printf 'package main\nimport "fmt"\nfunc main(){fmt.Println("Ubuntu26 Go works")}\n' >/tmp/ubuntu-2604.go
          go run /tmp/ubuntu-2604.go
          printf 'fn main(){println!("Ubuntu26 Rust works");}\n' >/tmp/ubuntu-2604.rs
          rustc /tmp/ubuntu-2604.rs -o /tmp/ubuntu-2604
          /tmp/ubuntu-2604
