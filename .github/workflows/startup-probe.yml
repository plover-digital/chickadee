name: Runner startup probe
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Warm profile to measure
        type: choice
        default: chickadee
        options:
          - chickadee
          - chickadee-small-ubuntu-2604
          - chickadee-medium-ubuntu-2604
permissions: {}
jobs:
  chickadee:
    if: github.repository == 'plover-digital/chickadee' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    steps:
      - name: First command
        run: date --utc '+first_command=%Y-%m-%dT%H:%M:%S.%NZ'
  hosted:
    if: github.repository == 'plover-digital/chickadee' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: First command
        run: date --utc '+first_command=%Y-%m-%dT%H:%M:%S.%NZ'
